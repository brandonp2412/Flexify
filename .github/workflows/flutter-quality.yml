name: Reusable Flutter quality

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run flutter test after formatting and analysis
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned Flutter SDK
        shell: bash
        run: |
          test -x flutter/bin/flutter || {
            echo 'Expected the repository-pinned Flutter SDK at ./flutter' >&2
            exit 1
          }
          flutter/bin/flutter --version

      - name: Install dependencies
        run: flutter/bin/flutter pub get

      - name: Check formatting
        shell: bash
        run: |
          paths=()
          for path in lib test integration_test patrol_test; do
            [[ -d "$path" ]] && paths+=("$path")
          done
          if ((${#paths[@]})); then
            flutter/bin/dart format --output=none --set-exit-if-changed "${paths[@]}"
          fi

      - name: Analyze
        run: flutter/bin/flutter analyze

      - name: Test
        if: ${{ inputs.run_tests }}
        run: flutter/bin/flutter test
