name: Deploy to Google Play

# Google play takes more than a day to
# review our updates. So if we release the
# app more than once a day, every new update
# pushes back the "review process" by 1 day.
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-google-play
  cancel-in-progress: true

jobs:
  deploy-google-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: app-release.aab

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Create Google Play JSON key file
        run: |
          echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > google-play-key.json
          mkdir -p ~/.config
          cp google-play-key.json ~/.config/googlePlay.json

      - name: Deploy to Google Play
        run: |
          set +e
          bundle exec fastlane android metadata track:production
          bundle exec fastlane supply \
            --aab app-release.aab \
            --json_key google-play-key.json \
            --package_name com.presley.flexify \
            --track production \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -qE 'Version code [0-9]+ has already been used' deploy.log; then
            echo "The latest release is already uploaded or pending review in Google Play."
            exit 0
          fi
          exit "$status"
