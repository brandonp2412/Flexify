pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '9.3.2' apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

gradle.beforeProject { target ->
    target.buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build"
                    && details.requested.name == "gradle") {
                details.useVersion("9.3.2")
                details.because("Use the host app's AGP for all Flutter plugin subprojects")
            }
        }
    }
}

include ":app"
