plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
   keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingPolicy = new Properties()
def signingPolicyFile = rootProject.file('signing-policy.properties')
if (!signingPolicyFile.isFile()) {
    throw new GradleException("Missing Android signing policy: " + signingPolicyFile)
}
signingPolicyFile.withInputStream { signingPolicy.load(it) }

def productionApplicationId = signingPolicy.getProperty('productionApplicationId')
def expectedReleaseCertificateSha256 = signingPolicy
    .getProperty('githubReleaseCertificateSha256', '')
    .replaceAll('[^0-9A-Fa-f]', '')
    .toLowerCase()

if (!productionApplicationId || expectedReleaseCertificateSha256.size() != 64) {
    throw new GradleException("Invalid Android signing policy in " + signingPolicyFile)
}

def signingCertificateSha256 = { signingConfig ->
    if (signingConfig == null ||
        signingConfig.storeFile == null ||
        !signingConfig.storeFile.isFile() ||
        !signingConfig.storePassword ||
        !signingConfig.keyAlias) {
        return null
    }

    def keyStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
    signingConfig.storeFile.withInputStream {
        keyStore.load(it, signingConfig.storePassword.toCharArray())
    }
    def certificate = keyStore.getCertificate(signingConfig.keyAlias)
    if (certificate == null) {
        return null
    }

    return java.security.MessageDigest.getInstance('SHA-256')
        .digest(certificate.encoded)
        .collect { String.format('%02x', it & 0xff) }
        .join()
}

def configuredReleaseSigning = null
if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
    def configuredStoreFile = file(keystoreProperties['storeFile'])
    configuredReleaseSigning = [
        storeFile: configuredStoreFile,
        storePassword: keystoreProperties['storePassword'],
        keyAlias: keystoreProperties['keyAlias'],
    ]
}

def configuredReleaseCertificateSha256 = signingCertificateSha256(configuredReleaseSigning)

// Optional env vars used by CI to build a side-by-side testing app
// (e.g. PR builds with applicationId com.presley.flexify.pr). Deliberately
// not product flavors: declaring productFlavors would force --flavor onto
// every existing build command, including the F-Droid recipe maintained
// outside this repo.
def requestedAppIdSuffix = System.getenv('FLEXIFY_APP_ID_SUFFIX') ?: ''
def requestedAppLabel = System.getenv('FLEXIFY_APP_LABEL')
def runningInCi = (System.getenv('CI') ?: '').equalsIgnoreCase('true')

def appIdSuffix = requestedAppIdSuffix
def appLabel = requestedAppLabel ?: 'Flexify'

// A local machine without the upstream release key must never replace the
// production package. Make its build side-by-side automatically instead.
if (!runningInCi &&
    !appIdSuffix &&
    configuredReleaseCertificateSha256 != expectedReleaseCertificateSha256) {
    appIdSuffix = '.dev'
    appLabel = requestedAppLabel ?: 'Flexify Dev'
}

android {
    namespace "com.presley.flexify"
    compileSdkVersion 37
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
        if (appIdSuffix) {
            main.res.srcDirs += 'src/pr/res'
        }
    }

    defaultConfig {
        applicationId "com.presley.flexify" + appIdSuffix
        manifestPlaceholders += [
            appLabel: appLabel,
            appIcon: appIdSuffix ? "@mipmap/ic_launcher_pr" : "@mipmap/ic_launcher",
        ]
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Reproducible builds configuration
    packagingOptions {
        // Exclude files that can cause reproducibility issues
        excludes += ['META-INF/DEPENDENCIES']
        excludes += ['META-INF/LICENSE']
        excludes += ['META-INF/LICENSE.txt']
        excludes += ['META-INF/NOTICE']
        excludes += ['META-INF/NOTICE.txt']
        excludes += ['LICENSE-junit.txt']
        excludes += ['META-INF/services/U1.a']
        excludes += ['META-INF/services/U1.b']
        excludes += ['META-INF/services/X1.a']
        excludes += ['META-INF/services/X1.b']
        // Ensure deterministic ordering
        pickFirsts += ['**/libc++_shared.so']
        pickFirsts += ['**/libjsc.so']
        // Exclude problematic directories
        excludes += ['androidx/**']
        excludes += ['junit/**']
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   buildTypes {
       profile {
           if (keystorePropertiesFile.exists()) {
               signingConfig signingConfigs.release
           }
           // Reproducible builds
           buildConfigField "long", "BUILD_TIME", "0L"
       }
       debug {
           if (keystorePropertiesFile.exists()) {
               signingConfig signingConfigs.release
           }
           // Reproducible builds
           buildConfigField "long", "BUILD_TIME", "0L"
       }
       release {
           signingConfig signingConfigs.release
           // Reproducible builds
           buildConfigField "long", "BUILD_TIME", "0L"
       }
   }
   // https://github.com/brandonp2412/Flexify/issues/125
   dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

// Fail closed for any signed production-package build. F-Droid can still
// produce an unsigned release for external signing, while local development
// uses the side-by-side .dev package when the upstream key is unavailable.
gradle.taskGraph.whenReady { taskGraph ->
    if (appIdSuffix) {
        return
    }

    def packagingTasks = taskGraph.allTasks.findAll { task ->
        task.project == project &&
            task.name ==~ /(?i)^(assemble|bundle|package|install).*/
    }
    if (packagingTasks.isEmpty()) {
        return
    }

    android.buildTypes.each { buildType ->
        def buildTypeRequested = packagingTasks.any { task ->
            task.name.toLowerCase().contains(buildType.name.toLowerCase())
        }
        if (!buildTypeRequested) {
            return
        }

        def signingConfig = buildType.signingConfig
        if (signingConfig == null ||
            signingConfig.storeFile == null ||
            !signingConfig.storeFile.isFile()) {
            if (buildType.name == 'release') {
                // F-Droid's build is intentionally unsigned here and signed
                // externally by its own distribution pipeline.
                return
            }
            throw new GradleException(
                "Refusing to package " + productionApplicationId +
                " without the upstream GitHub release signing key. " +
                "Use FLEXIFY_APP_ID_SUFFIX for a side-by-side test build."
            )
        }

        def actualCertificateSha256 = signingCertificateSha256(signingConfig)
        if (actualCertificateSha256 != expectedReleaseCertificateSha256) {
            throw new GradleException(
                "Refusing to package " + productionApplicationId +
                " with a non-upstream signing key. Expected SHA-256 " +
                expectedReleaseCertificateSha256 + " but got " +
                (actualCertificateSha256 ?: '<missing>') +
                ". Use FLEXIFY_APP_ID_SUFFIX for a side-by-side test build."
            )
        }
    }
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 100 + abiVersionCode
        } else if (output.getFilter(com.android.build.OutputFile.ABI) == null) {
            // This is a universal APK
            output.versionCodeOverride = variant.versionCode * 100 + 3
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Flutter's integration_test plugin currently pins these compatible versions.
    androidTestImplementation 'androidx.test:core:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
}
